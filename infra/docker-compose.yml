version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: printngo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: printngo
      POSTGRES_PASSWORD: printngo_password
      POSTGRES_DB: printngo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printngo -d printngo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: printngo_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: printngo_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/printngo-jobs --ignore-existing;
      /usr/bin/mc anonymous set download myminio/printngo-jobs;
      exit 0;
      "

  libreoffice-converter:
    image: gotenberg/gotenberg:8
    container_name: printngo_converter
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - GOTENBERG_API_PORT=3000

volumes:
  postgres_data:
  minio_data:
